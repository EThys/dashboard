<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Générer og-image.png — CasaNayo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
        font-family: Outfit, sans-serif;
        color: #fff;
        gap: 24px;
      }
      canvas {
        border-radius: 12px;
        max-width: 100%;
      }
      button {
        background: #22c55e;
        color: #fff;
        border: none;
        padding: 14px 40px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #16a34a;
      }
    </style>
  </head>
  <body>
    <h2>Image OG — CasaNayo (1200 × 630 px)</h2>
    <canvas id="og" width="1200" height="630"></canvas>
    <button onclick="download()">⬇ Télécharger og-image.png</button>

    <script>
      const canvas = document.getElementById("og");
      const ctx = canvas.getContext("2d");

      // Fond dégradé vert foncé
      const grad = ctx.createLinearGradient(0, 0, 1200, 630);
      grad.addColorStop(0, "#0d2b1a");
      grad.addColorStop(1, "#1B4332");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1200, 630);

      // Cercle décoratif droite
      ctx.beginPath();
      ctx.arc(1050, 315, 280, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(34,197,94,0.08)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(1050, 315, 200, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(34,197,94,0.12)";
      ctx.fill();

      // Barre verte accent gauche
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(80, 100, 6, 300);

      // Nom de la marque
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 96px Outfit, sans-serif";
      ctx.fillText("CasaNayo", 110, 230);

      // Underline vert
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(110, 248, 480, 6);

      // Tagline
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.font = "500 36px Outfit, sans-serif";
      ctx.fillText("Immobilier N°1 en RDC", 110, 320);

      // Description
      ctx.fillStyle = "rgba(255,255,255,0.60)";
      ctx.font = "400 26px Outfit, sans-serif";
      ctx.fillText("Achetez · Vendez · Louez en toute confiance", 110, 375);

      // Icône maison (dessin canvas)
      const hx = 960,
        hy = 210,
        hs = 180;
      // toit
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx - hs / 2, hy + hs * 0.45);
      ctx.lineTo(hx + hs / 2, hy + hs * 0.45);
      ctx.closePath();
      ctx.fillStyle = "#22c55e";
      ctx.fill();
      // corps
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(hx - hs * 0.35, hy + hs * 0.43, hs * 0.7, hs * 0.5);
      // porte
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(hx - 22, hy + hs * 0.63, 44, hs * 0.3);
      // fenêtres
      ctx.fillStyle = "#1B4332";
      ctx.fillRect(hx - hs * 0.28, hy + hs * 0.5, 38, 34);
      ctx.fillRect(hx + hs * 0.07, hy + hs * 0.5, 38, 34);

      // URL bottom right
      ctx.fillStyle = "rgba(255,255,255,0.40)";
      ctx.font = "400 22px Outfit, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("casanayo.com", 1140, 590);

      function download() {
        const link = document.createElement("a");
        link.download = "og-image.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }
    </script>
  </body>
</html>
